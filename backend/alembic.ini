# Alembic 配置。
# 连接串不写在此处：由 alembic/env.py 从 ai_roi.shared.config.settings.sync_database_url 读取，
# 保证与应用共用同一份 .env（单一事实来源）。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
