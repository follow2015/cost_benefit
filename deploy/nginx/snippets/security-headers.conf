# 安全响应头（HTTP 版）—— 每个 location 都要 include 一次。
#
# 为什么不能只在 server 层写一遍：
#   nginx 的 add_header 是「当前层级出现任意 add_header 就**完全**不继承上层」，
#   不是合并。原配置只在 server 层写了三个头，而 /assets/ 与 = /index.html 两个
#   location 各自加了 Cache-Control —— 这两个 location 于是静默丢掉了全部安全头，
#   恰好覆盖静态资源与入口 HTML，也就是最该保护的部分。
#
# 用法：
#   location /assets/ {
#       include snippets/security-headers.conf;
#       add_header Cache-Control "public, immutable";
#   }

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# CSP：把「能加载什么」写死。default-src 'self' 让外部脚本/外链样式一律失效，
# 这是挡 XSS 最有效的一层（前端即便有注入点，script-src 也拦住了外站脚本）。
#
# 两处必须放行，否则页面会静默降级（实测：字体请求被拦，界面掉回系统默认字体）：
#   - style-src 需 'unsafe-inline'：antd 6 走 CSS-in-JS，运行时注入 <style>。
#   - style-src 还需 fonts.googleapis.com、font-src 需 fonts.gstatic.com：
#     前端 index.html 直接引了 Google Fonts 的 IBM Plex。
#
# 这两条外部依赖本身是个隐患（内网/弱网环境拉不到会拖慢首屏）。彻底解法是把字体
# 文件放进 public/ 自托管，然后把这两个域从 CSP 里删掉 —— 那时 CSP 才算真正收紧。
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
