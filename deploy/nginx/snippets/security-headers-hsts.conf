# 安全响应头（HTTPS 版）—— 比 HTTP 版多 HSTS。
#
# HSTS 只在 HTTPS 响应里发才有意义：浏览器收到过一次就记住「这个域只用 HTTPS」，
# 之后即使用户手输 http:// 也不会先发明文请求。所以在 HTTP server 里加它是无害
# 但无效的，必须放在 TLS server 上。
#
# includeSubDomains 的前提是「所有子域都支持 HTTPS」，否则会把子域一起打死。
# 本平台当前没有子域，保留；将来挂了只支持 HTTP 的子域，把这项删掉。
#
# 注意：一旦浏览器记住 HSTS，证书过期期间访问会直接硬失败（不给「继续访问」）。
# 自签证书阶段调试请用独立浏览器 profile，别在日常 profile 里踩进去。

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP 说明见 security-headers.conf（同一份内容，HTTPS 侧的 location 也要 include）
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
