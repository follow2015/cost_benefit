# =============================================================================
# 站点：cost_benefit（AI 算力投资 ROI 测算平台）
#
# 仓库内的版本化副本。实际部署位置：C:\nginx\conf\conf.d\cost_benefit.conf
# 片段目录需一并复制到：C:\nginx\conf\snippets\
#
# 对外端口说明（实测结论，别照文档猜）：
#   80   —— 建了但**外网打不开**：TCP 能连，HTTP 被运营商阻断（未备案封 80）
#   8080 —— 对外主入口，生产构建（nginx 直发 dist），海外节点实测 HTTP 200
#   8443 —— HTTPS 入口（自签证书或正式证书，见下方 ssl_certificate）
#   8081 —— 内网调试入口，仅绑 127.0.0.1，反代 Vite dev server
#
# 链路：
#   浏览器 → nginx:8080/8443 ─┬ /api/ → 127.0.0.1:8000（uvicorn，跑在 WSL 里）
#                             └ /     → C:/.../frontend/dist（静态文件）
#   浏览器 → nginx:8081 ──────┬ /api/ → 127.0.0.1:8000
#                             └ /     → 127.0.0.1:5173（Vite dev，热更新）
#
# 运维：改完必须 `C:\nginx\nginx.exe -p C:\nginx -c conf/nginx.conf -t`
#       验证语法后再 `-s reload`（先 -t，别直接 reload：语法错会让整个站点掉）。
#
# 关于 include 为什么写绝对路径：nginx 的 include 相对路径是相对 **prefix**
# （这里是 C:\nginx），不是相对当前配置文件所在目录。配置躺在 conf/conf.d/ 下，
# 写相对的 snippets/xxx.conf 会解析成 C:\nginx\snippets\xxx.conf 而报文件不存在。
# 换部署路径时改下面所有 include 的前缀即可。
# =============================================================================

# ---- 后端：高频短请求，开 keepalive 复用连接 ----
upstream cost_benefit_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# 生产站点 · 明文入口（80 / 8080）
#
# 保留 HTTP 是为了兼容现有访问方式；正式域名 + 证书就绪后，建议把这里改成
# 整站跳转（见文件末尾的注释块），让凭据不再走明文。
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      8080;
    server_name _;          # 绑定域名后改成 server_name roi.example.com;

    allow 203.0.113.10;   # 占位（RFC5737 文档网段）：换成你自己的运维出口 IP
    allow 127.0.0.1;
    deny all;

    root  "C:/Users/Administrator/Desktop/cost_benefit/frontend/dist";
    index index.html;

    access_log logs/cost_benefit.access.log main;
    error_log  logs/cost_benefit.error.log warn;

    client_max_body_size 20m;

    # ---- 后端 API：必须排在 location / 之前 ----
    location /api/ {
        include C:/nginx/conf/snippets/security-headers.conf;

        proxy_pass          http://cost_benefit_api;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;   # 计算/导入/PDF 导出可能跑几十秒，别用默认 60s
        proxy_buffering       off;
    }

    # ---- Vite 产物带内容 hash，可以放开长缓存 ----
    location /assets/ {
        include C:/nginx/conf/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA 路由回退：刷新 /scenarios/123 不会 404 ----
    location / {
        include C:/nginx/conf/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不缓存，否则前端发版后用户拿不到新壳
    location = /index.html {
        include C:/nginx/conf/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 护栏：源码、密钥、内部目录一律不外泄 ----
    location ~ /\.(git|env|workbuddy|codebuddy) {
        include C:/nginx/conf/snippets/security-headers.conf;
        deny all;
        return 404;
    }
}

# -----------------------------------------------------------------------------
# 生产站点 · TLS 入口（8443）
#
# 证书：
#   - 自签（当前，便于内网/本机验证）：scripts/gen-self-signed-cert.sh 生成到
#     C:/nginx/conf/certs/roi.crt 与 roi.key。浏览器会警告「不受信任」，属预期；
#     自签只解决「链路上是密文」，不解决「对方是不是它声称的那台机器」。
#   - 正式：用 certbot / 云厂商证书换掉下面两行，并把 server_name 改成真实域名。
#     换正式证书后建议把 8080 改成 301 跳到这里。
#
# HSTS 只在这个 server 里发（见 snippets/security-headers-hsts.conf）。
# 自签阶段先别急着让浏览器记住 HSTS：证书一过期就是硬失败，连「继续访问」都不给。
# 等换成正式证书、确认续期链路后再观察一段时间。
# -----------------------------------------------------------------------------
server {
    listen      8443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     "C:/nginx/conf/certs/roi.crt";
    ssl_certificate_key "C:/nginx/conf/certs/roi.key";

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    allow 203.0.113.10;   # 占位（RFC5737 文档网段）：换成你自己的运维出口 IP
    allow 127.0.0.1;
    deny all;

    root  "C:/Users/Administrator/Desktop/cost_benefit/frontend/dist";
    index index.html;

    access_log logs/cost_benefit.ssl.access.log main;
    error_log  logs/cost_benefit.ssl.error.log warn;

    client_max_body_size 20m;

    location /api/ {
        include C:/nginx/conf/snippets/security-headers-hsts.conf;

        proxy_pass          http://cost_benefit_api;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;   # = https，后端据此判断安全上下文
        proxy_set_header    X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    location /assets/ {
        include C:/nginx/conf/snippets/security-headers-hsts.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        include C:/nginx/conf/snippets/security-headers-hsts.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include C:/nginx/conf/snippets/security-headers-hsts.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\.(git|env|workbuddy|codebuddy) {
        include C:/nginx/conf/snippets/security-headers-hsts.conf;
        deny all;
        return 404;
    }
}

# -----------------------------------------------------------------------------
# 开发站点：内网调试（8081），反代 Vite dev server
#
# ⚠️ 只绑 127.0.0.1 —— dev server 会把 /src/**.tsx 原样吐给浏览器（等于开放源码）。
#    前端 .env.local 里的 FRONTEND_HOST 也必须是 127.0.0.1；填 '::' 或 0.0.0.0
#    会让 5173 直接暴露到局域网，绕过这里的全部限制。
# 前置：cd frontend && npm run dev
#
# 这里**不加 CSP**：HMR 依赖 eval 与 WebSocket，写死 script-src 'self' 会把热更新打死。
# 调试站不对外，风险由绑定地址控制。
# -----------------------------------------------------------------------------
server {
    listen      127.0.0.1:8081;
    server_name _;

    access_log logs/cost_benefit.dev.access.log main;
    error_log  logs/cost_benefit.dev.error.log warn;

    location /api/ {
        proxy_pass          http://cost_benefit_api;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
    }

    location / {
        proxy_pass          http://127.0.0.1:5173;
        proxy_http_version  1.1;
        # HMR 靠真正的 upgrade 跳转，缺这两行 dev 页面不会热更新
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  300s;   # 首次冷启动要做依赖预打包
    }

    location ~ /\.(git|env|workbuddy|codebuddy) {
        deny all;
        return 404;
    }
}

# =============================================================================
# 换到正式证书后，把上面的 HTTP server 改成纯跳转（删掉 root / location 段）：
#
#   server {
#       listen      80;
#       listen      8080;
#       server_name roi.example.com;
#       return 301 https://$host:8443$request_uri;
#   }
#
# 做这一步之前先确认 HTTPS 入口一切正常 —— 跳过去发现证书不对，就等于把站点关掉。
# =============================================================================
